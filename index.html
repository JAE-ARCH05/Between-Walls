const ACCENT='#222222';
const PUBLISHED_POSTS={
  'gagosian-0415':{title:'캔버스 위의 침묵',titleEn:'Silence on Canvas',image:'images/gagosian-0415/poster.jpg',gallery:'Gagosian',date:'2026.04.15'}
};
const GALLERY_IMAGES={'Gagosian':'images/gagosian-0415/poster.jpg','The Met':'images/met-0330/gallery1.avif'};
const REGIONS=[
  {id:'upstate',arrow:'↑',label:'UPSTATE',name:'Upstate',nameKo:'업스테이트',vibe:'도시를 벗어나 만나는 예술과 풍경.'},
  {id:'west',arrow:'←',label:'WEST',name:'West',nameKo:'서쪽으로',vibe:'필라델피아에서 워싱턴까지, 다음 여행의 공간들.'},
  {id:'longisland',arrow:'→',label:'LONG ISLAND',name:'Long Island',nameKo:'롱 아일랜드',vibe:'동쪽으로 이어지는 미술관과 작은 여행.'},
  {id:'elsewhere',arrow:'↗',label:'WORLD',name:'World',nameKo:'다른 도시, 다른 나라',vibe:'뉴욕 너머, 오래 기억하고 싶은 장소들.'}
];
const HOME_BOUNDS=[[40.667,-74.045],[40.859,-73.808]];
let map=null,overlays=[],galleryMarkers=[],activeView={type:'home',id:null},selectedGallery=null,viewBounds=null,viewMaxZoom=15;
const $=id=>document.getElementById(id);
function escapeHTML(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getArea(){return activeView.type==='district'?D[activeView.id]:activeView.type==='region'?{...REGIONS.find(r=>r.id===activeView.id),...REGION_GALLERIES[activeView.id]}:null;}
function setPanel(title,kicker,html){$('panel-title').textContent=title;$('panel-kicker').textContent=kicker;$('panel-content').innerHTML=html;$('view-status').textContent=title;}
function homePanel(){ $('panel-content').replaceChildren();$('view-status').textContent='New York map'; }
function areaPanel(){
  const d=getArea(),visited=d.galleries.filter(g=>g.entries.length).length;
  setPanel(activeView.type==='district'?'In this neighborhood':'Beyond the city','장소 둘러보기',`<div class="eyebrow">${escapeHTML(d.nameKo||'')}</div><h3 class="area-title">${escapeHTML(d.name)}</h3><p class="area-subtitle">${escapeHTML(d.vibe)}</p><div class="area-stats">${visited} VISITED &nbsp; / &nbsp; ${d.galleries.length} PLACES</div>${d.galleries.map((g,index)=>`<button class="gallery-row" data-gallery="${index}"><span><strong>${escapeHTML(g.name)}</strong><small><i class="status-dot${g.entries.length?'':' open'}"></i>${g.entries.length?`${g.entries.length}개의 방문 기록`:'아직 방문 전'}</small></span><span class="row-arrow" aria-hidden="true">↗</span></button>`).join('')}`);
}
function galleryPanel(index){
  const d=getArea(),g=d?.galleries[index];if(!g)return;
  selectedGallery=index;
  galleryMarkers.forEach((marker,i)=>marker.setIcon(pinIcon(d.galleries[i],i===index)));
  const photo=GALLERY_IMAGES[g.name];
  setPanel('A place & its stories','방문 기록',`<button class="panel-back" data-action="area">← ${escapeHTML(d.name)}</button><h3 class="gallery-heading">${escapeHTML(g.name)}</h3><p class="area-subtitle">${escapeHTML(d.nameKo||d.name)} · ${g.entries.length?g.entries.length+'회 방문':'아직 방문 전'}</p>${photo?`<img class="gallery-photo" src="${photo}" alt="${escapeHTML(g.name)} 전시 공간" width="600" height="400"/>`:''}${g.entries.length?[...g.entries].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<article class="visit-entry"><time>${escapeHTML(e.date)}</time><p>${escapeHTML(e.desc)}</p>${PUBLISHED_POSTS[e.slug]?`<a class="text-link" href="posts/${e.slug}.html">글 읽기 · Read story ↗</a>`:''}</article>`).join(''):'<p class="empty-note">아직 방문 기록이 없어요.<br>다음에 만날 공간으로 남겨 둡니다.</p>'}`);
}
function clearView(){
  selectedGallery=null;
  if(!map)return;
  if(viewBounds)map.stop();
  map.closePopup();
  overlays.forEach(layer=>map.removeLayer(layer));overlays=[];galleryMarkers=[];selectedGallery=null;
}
function fitView(bounds,maxZoom=15){
  viewBounds=L.latLngBounds(bounds);viewMaxZoom=maxZoom;
  if(!map)return;
  map.invalidateSize({pan:false});
  map.fitBounds(viewBounds,{padding:[38,45],maxZoom,animate:false});
}
function updateNav(){
  const home=activeView.type==='home';
  $('back-btn').hidden=home;$('journal-panel').hidden=home;
  $('workspace').classList.toggle('has-selection',!home);
  $('map-wrap').classList.toggle('detail-mode',!home);
  $('map-wrap').classList.toggle('world-view',activeView.id==='elsewhere');
  document.querySelectorAll('.district-choice').forEach(b=>b.setAttribute('aria-pressed',String(activeView.type==='district'&&b.dataset.district===activeView.id)));
  $('map-title').textContent=home?'MAP':getArea().name.toUpperCase();
}
function pinIcon(g,selected=false){
  const visited=g.entries.length>0;
  return L.divIcon({className:'gallery-pin',html:`<span class="pin-shape${visited?'':' unvisited'}${selected?' selected':''}">${g.entries.length>1?g.entries.length:''}</span>`,iconSize:[18,18],iconAnchor:[9,9]});
}
function showGallery(index,scroll=false){
  galleryPanel(index);
  if(scroll&&window.matchMedia('(max-width:760px)').matches)$('journal-panel').scrollIntoView({behavior:'auto',block:'start'});
}
function addGalleryPins(galleries){
  if(!map)return;
  galleries.forEach((g,index)=>{
    const marker=L.marker([g.lat,g.lng],{icon:pinIcon(g),title:g.name,alt:g.name}).addTo(map);
    marker.getElement()?.setAttribute('aria-label',g.name);
    marker.bindTooltip(escapeHTML(g.name),{direction:'top',offset:[0,-8],opacity:1});
    marker.on('click',()=>showGallery(index,true));
    overlays.push(marker);galleryMarkers.push(marker);
  });
}
function adjustLabels(){
  if(activeView.type!=='home')return;
  const occupied=[];
  document.querySelectorAll('.district-label').forEach(el=>{
    el.classList.remove('label-crowded');
    const label=el.querySelector('.district-name'),box=label.getBoundingClientRect();
    if(occupied.some(b=>box.left<b.right+4&&box.right>b.left-4&&box.top<b.bottom+3&&box.bottom>b.top-3))el.classList.add('label-crowded');
    else occupied.push(box);
  });
}
function showHome(){
  clearView();activeView={type:'home',id:null};updateNav();homePanel();
  if(!map)return;
  fitView(HOME_BOUNDS,12);
  const order=['chelsea','ues','harlem','lic','dumbo','bushwick','les','soho','ev','midtown','heights','sbronx','wburg','redhook','flushing'];
  order.forEach(id=>{
    const d=D[id],bounds=L.latLngBounds(d.bounds);
    const area=L.rectangle(d.bounds,{color:ACCENT,weight:.7,opacity:.24,fillColor:ACCENT,fillOpacity:.065}).addTo(map);
    area.on('click',()=>selectDistrict(id));area.on('mouseover',()=>area.setStyle({fillOpacity:.15,opacity:.5}));area.on('mouseout',()=>area.setStyle({fillOpacity:.065,opacity:.24}));overlays.push(area);
    const name={ues:'Upper East Side',les:'Lower East Side',lic:'Long Island City',heights:'Washington Heights',flushing:'Flushing',soho:'SoHo / TriBeCa',midtown:'Midtown',sbronx:'South Bronx'}[id]||d.name;
    const label=L.marker(bounds.getCenter(),{title:d.name,alt:d.name,zIndexOffset:300,icon:L.divIcon({className:'district-label',html:`<span class="district-label-inner"><i class="district-dot"></i><span class="district-name">${escapeHTML(name)}</span></span>`,iconSize:[12,24],iconAnchor:[0,0]})}).addTo(map);
    label.getElement()?.setAttribute('aria-label',d.name);label.on('click',()=>selectDistrict(id));overlays.push(label);
  });
  requestAnimationFrame(adjustLabels);
}
function selectDistrict(id){
  const d=D[id];if(!d)return;
  clearView();activeView={type:'district',id};updateNav();areaPanel();
  if(!map)return;
  const bounds=L.latLngBounds(d.bounds);d.galleries.forEach(g=>bounds.extend([g.lat,g.lng]));fitView(bounds,15);
  const area=L.rectangle(d.bounds,{color:ACCENT,weight:1,opacity:.45,fillColor:ACCENT,fillOpacity:.045,interactive:false}).addTo(map);overlays.push(area);addGalleryPins(d.galleries);
}
function selectRegion(id){
  if(!REGION_GALLERIES[id])return;
  clearView();activeView={type:'region',id};updateNav();areaPanel();
  if(!map)return;
  if(id==='elsewhere'){
    // Keep East Asia in view even when saved places are only in the US and Europe.
    fitView([[-58,-175],[76,180]],3);
    [['NORTH AMERICA',48,-115],['EUROPE',58,12],['EAST ASIA',35,118]].forEach(([name,lat,lng])=>{
      const label=L.marker([lat,lng],{interactive:false,keyboard:false,icon:L.divIcon({className:'world-label',html:name,iconSize:[105,16],iconAnchor:[35,8]})}).addTo(map);overlays.push(label);
    });
  }else fitView(getArea().galleries.map(g=>[g.lat,g.lng]),10);
  addGalleryPins(getArea().galleries);
}
function setupBasemap(){
  const attribution='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>';
  if(!L.vectorGrid){L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution,updateWhenIdle:true,updateWhenZooming:false,keepBuffer:1}).addTo(map);return;}
  const styles={};
  // Hide source labels and transit details; our place names supply the hierarchy.
  ['water_polygons_labels','water_lines_labels','dam_lines','dam_polygons','pier_lines','pier_polygons','boundary_labels','place_labels','sites','addresses','street_polygons','street_labels','streets_polygons_labels','street_labels_points','aerialways','ferries','public_transport','pois'].forEach(name=>styles[name]=[]);
  const fill=color=>({fill:true,fillColor:color,fillOpacity:1,stroke:false,weight:0});
  Object.assign(styles,{
    ocean:fill('#e3e9e8'),water_polygons:fill('#e3e9e8'),
    water_lines:{color:'#e3e9e8',weight:1,opacity:1},
    land:p=>['forest','wood','grass','park','meadow','recreation_ground'].includes(p.kind)?fill('#e7e9de'):[],
    buildings:(p,z)=>z>=14?fill('#e7e7e4'):[],
    boundaries:p=>p.admin_level<=2?{color:'#bfc3c1',weight:.7,opacity:.7}:[],
    streets:(p,z)=>{if(p.rail||p.tunnel||['footway','path','cycleway','steps','service','track'].includes(p.kind))return [];const major=['motorway','trunk','primary','secondary'].includes(p.kind);if(z<12&&!major)return [];return {color:major?'#dad6cd':'#fffdf7',weight:z<12?.7:major?1.3:.8,opacity:z<12?.6:1};},
    bridges:fill('#efece5')
  });
  // Draw into one retina-sized canvas per tile instead of thousands of SVG nodes.
  const canvasTile=(coords,size,options)=>{
    const renderer=L.canvas.tile(coords,size,options),canvas=renderer.getContainer();
    const ratio=Math.min(window.devicePixelRatio||1,2);
    canvas.width=size.x*ratio;canvas.height=size.y*ratio;
    canvas.style.width=size.x+'px';canvas.style.height=size.y+'px';
    canvas.getContext('2d').setTransform(ratio,0,0,ratio,0,0);
    return renderer;
  };
  const basemap=L.vectorGrid.protobuf('https://vector.openstreetmap.org/shortbread_v1/{z}/{x}/{y}.mvt',{rendererFactory:canvasTile,vectorTileLayerStyles:styles,interactive:false,noWrap:true,maxNativeZoom:14,maxZoom:16,minZoom:0,attribution,updateWhenIdle:true,updateWhenZooming:false,keepBuffer:1});
  // Reuse decoded tiles during normal navigation; no prefetching or offline downloads.
  const cache=new Map(),loadTile=basemap._getVectorTilePromise.bind(basemap);
  basemap._getVectorTilePromise=coords=>{
    const key=coords.z+'/'+coords.x+'/'+coords.y;
    if(cache.has(key)){const value=cache.get(key);cache.delete(key);cache.set(key,value);return value;}
    const pending=loadTile(coords).catch(()=>{cache.delete(key);return {layers:{}};});
    cache.set(key,pending);if(cache.size>48)cache.delete(cache.keys().next().value);
    return pending;
  };
  basemap.addTo(map);
}
function init(){
  $('district-count').textContent=String(Object.keys(D).length).padStart(2,'0');
  $('legend').innerHTML=Object.entries(D).map(([id,d])=>`<button class="district-choice" data-district="${id}" aria-pressed="false"><span>${escapeHTML(d.name)}</span><small>${String(d.galleries.length).padStart(2,'0')}</small></button>`).join('');
  $('legend').addEventListener('click',e=>{const b=e.target.closest('[data-district]');if(b)selectDistrict(b.dataset.district);});
  REGIONS.forEach(r=>{const b=document.createElement('button');b.className='region-edge';b.type='button';b.dataset.region=r.id;b.title=r.id==='elsewhere'?'Other states / countries':r.name;b.textContent=r.id==='longisland'?`${r.label} ${r.arrow}`:`${r.arrow} ${r.label}`;b.addEventListener('click',()=>selectRegion(r.id));$('region-nav').appendChild(b);});
  $('back-btn').addEventListener('click',showHome);
  $('panel-content').addEventListener('click',e=>{
    const back=e.target.closest('[data-action="area"]');if(back){selectedGallery=null;galleryMarkers.forEach((m,i)=>m.setIcon(pinIcon(getArea().galleries[i])));areaPanel();return;}
    const b=e.target.closest('[data-gallery]');if(!b)return;if(b.dataset.district)selectDistrict(b.dataset.district);showGallery(Number(b.dataset.gallery));
  });
  document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(selectedGallery!==null){selectedGallery=null;galleryMarkers.forEach((m,i)=>m.setIcon(pinIcon(getArea().galleries[i])));areaPanel();}else if(activeView.type!=='home')showHome();});
  if(typeof L==='undefined'){$('map').innerHTML='<p class="map-error">지도를 불러오지 못했어요. 아래 지역 목록에서 장소와 기록을 볼 수 있어요.</p>';showHome();return;}
  map=L.map('map',{zoomControl:false,scrollWheelZoom:false,doubleClickZoom:false,dragging:false,touchZoom:false,boxZoom:false,keyboard:false,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false});
  setupBasemap();
  map.on('resize',()=>{if(viewBounds)map.fitBounds(viewBounds,{padding:[38,45],maxZoom:viewMaxZoom,animate:false});requestAnimationFrame(adjustLabels);});
  showHome();
}
window.addEventListener('DOMContentLoaded',init);
