/* ── Portfolio button ── */
#portfolio-btn{

#portfolio-btn:hover{background:#EDEBE5;border-color:#B8B3AA}

/* ── PAGE ── */
#app{width:100%;max-width:700px;margin:0 auto;padding:24px 24px 48px}

#topbar{display:none;align-items:center;gap:12px;padding:11px 0 11px;margin-bottom:0;border-bottom:1px solid #E0DDD8}
.back-btn{font-family:'DM Mono',monospace;font-size:11px;color:#777;cursor:pointer;padding:4px 12px;border:1px solid #D5D1C9;border-radius:5px;background:transparent;letter-spacing:0.3px;transition:background 0.15s}
.back-btn:hover{background:#EDEBE5}
#bar-name{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:0.5px}
#bar-vibe{font-size:11px;color:#999;margin-top:1px}

#map-wrap{width:100%;aspect-ratio:1/1;border:1px solid #E0DDD8;border-radius:10px;overflow:hidden;margin-top:20px}
#map-wrap.detail-mode{border-radius:0 0 10px 10px;margin-top:0}
#map{width:100%;height:100%}

#legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.leg-item{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:10px;color:#888;cursor:pointer;padding:2px 0}
.leg-item:hover{color:#222}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.leaflet-popup-content{margin:14px 16px}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{font-size:15px!important;color:#BBB!important;top:8px!important;right:10px!important}

.tt-wrap{max-width:225px;font-family:'DM Sans',sans-serif}

.tt-vibe{font-size:11px;color:#777;line-height:1.5;margin-bottom:7px}

.pp-name{font-size:13px;font-weight:500;color:#1A1A1A;margin-bottom:2px}

.pp-desc{font-size:12px;color:#555;line-height:1.5}
.pp-link{font-family:'DM Mono',monospace;font-size:11px;color:#7F77DD;margin-top:4px;display:block}

  const bg=visited?color:'#C8C3BB';
  const num=visited&&count>1?`<span style="font-size:9px;font-family:'DM Mono',monospace;color:white;line-height:1">${count}</span>`:'';
  return L.divIcon({className:'',html:`<div style="width:16px;height:16px;border-radius:50%;background:${bg};border:2.5px solid white;box-shadow:0 1px 5px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer">${num}</div>`,iconSize:[16,16],iconAnchor:[8,8]});
}

function ttHTML(d){
  return `<div class="tt-wrap"><div class="tt-name">${d.name} <span style="color:#AAA;font-weight:300">/ ${d.nameKo}</span></div><div class="tt-vibe">${d.vibe}</div><div class="tt-tags">${d.tags.map(t=>`<span class="tt-tag" style="background:${t.bg};color:${t.tc}">${t.t}</span>`).join('')}</div></div>`;
}

function drawDistricts(){
  pL.forEach(l=>map.removeLayer(l));pL=[];
  dL.forEach(l=>map.removeLayer(l));dL=[];
  Object.entries(D).forEach(([id,d])=>{
    const r=L.rectangle(d.bounds,{color:d.color,weight:1.5,fillColor:d.color,fillOpacity:0,dashArray:'6,4'}).addTo(map);
    let hp=null;
    r.on('mouseover',function(ev){
      this.setStyle({fillOpacity:0.16,weight:2});
      const northOffset = id==='sbronx' ? [0,180] : id==='harlem' ? [0,160] : id==='heights' ? [0,120] : [0,-2];
      const isNorth = ['sbronx','harlem','heights'].includes(id);
      hp=L.popup({closeButton:false,offset:northOffset,autoPan:isNorth}).setLatLng(ev.latlng).setContent(ttHTML(d)).openOn(map);
    });
    r.on('mousemove',function(ev){if(hp)hp.setLatLng(ev.latlng);});
    r.on('mouseout',function(){this.setStyle({fillOpacity:0,weight:1.5});map.closePopup();hp=null;});
    r.on('click',()=>zoom(id));
    dL.push(r);
  });
}

function zoom(id){
  if(isZ)return;
  map.closePopup();isZ=true;
  const d=D[id];
  dL.forEach(l=>map.removeLayer(l));dL=[];
  const r=L.rectangle(d.bounds,{color:d.color,weight:2,fillColor:d.color,fillOpacity:0.09,dashArray:'6,4'}).addTo(map);
  dL.push(r);
  const[[s,w],[n,e]]=d.bounds,pad=0.014;
  map.flyToBounds([[s-pad,w-pad*1.5],[n+pad,e+pad*1.5]],{duration:0.5});
  document.getElementById('topbar').style.display='flex';
  document.getElementById('bar-name').textContent=`${d.name} / ${d.nameKo}`;
  document.getElementById('bar-vibe').textContent=d.vibe;
  const v=d.galleries.filter(g=>g.entries.length>0).length;
  document.getElementById('bar-count').textContent=`${v} / ${d.galleries.length} visited`;
  document.getElementById('map-wrap').classList.add('detail-mode');

  pL.forEach(l=>map.removeLayer(l));pL=[];
  d.galleries.forEach(g=>{
    const vis=g.entries.length>0;
    const m=L.marker([g.lat,g.lng],{icon:pinIcon(d.color,g.entries.length,vis)}).addTo(map);
    m.bindTooltip(`<span style="font-family:'DM Sans',sans-serif;font-size:12px;color:#1A1A1A">${g.name}</span>`,{direction:'top',offset:[0,-10],opacity:1});
    m.on('click',()=>showPop(g));
    pL.push(m);
  });
}

function showPop(g){
  map.closePopup();
  let c=g.entries.length===0
    ?`<div class="pp-wrap"><div class="pp-name">${g.name}</div><div class="pp-empty">아직 방문 기록이 없어요</div></div>`
    :`<div class="pp-wrap"><div class="pp-name">${g.name}</div><div class="pp-cnt">${g.entries.length}회 방문</div>${g.entries.map(e=>{
        const post=getPost(e.slug);
        return `<div class="pp-item" onclick="window.location='posts/${e.slug}.html'">
          <div class="pp-date">${e.date}</div>
          <div class="pp-desc">${e.desc}</div>
          <a class="pp-link">글 읽기 · Read post →</a>
        </div>`;
      }).join('')}</div>`;
  L.popup({offset:[0,-10],maxWidth:265}).setLatLng([g.lat,g.lng]).setContent(c).openOn(map);
}

document.getElementById('back-btn').addEventListener('click',()=>{
  map.closePopup();
  if (rZoomed) { backFromRegion(); return; }
  isZ = false;
  pL.forEach(l=>map.removeLayer(l)); pL=[];
  document.getElementById('topbar').style.display='none';
  document.getElementById('map-wrap').classList.remove('detail-mode');
  map.flyToBounds([[40.695,-74.032],[40.823,-73.898]],{duration:0.5});
  drawDistricts();
});

document.getElementById('legend').innerHTML=Object.entries(D).map(([id,d])=>`<div class="leg-item" onclick="legClick('${id}')"><div class="leg-dot" style="background:${d.color}"></div><span>${d.name}</span></div>`).join('');
function legClick(id) {
  if (rZoomed) { backFromRegion(); setTimeout(()=>zoom(id), 800); return; }
  if (isZ) { map.closePopup(); isZ=false; pL.forEach(l=>map.removeLayer(l));pL=[];dL.forEach(l=>map.removeLayer(l));dL=[]; drawDistricts(); setTimeout(()=>zoom(id),100); return; }
  zoom(id);
}

drawDistricts();

// ════════════════════════════════════════════════════
const REGION_GALLERIES = {
  upstate: {
    color:'#7F77DD',
    galleries:[

// 방향 화살표 마커
// ════════════════════════════════════════════════════
const REGIONS = [
  { id:'upstate',    arrow:'↑', label:'UPSTATE',
    lat:40.828, lng:-73.955, color:'#7F77DD',
    bounds:[[40.695,-74.032],[42.900,-70.800]] },
  { id:'elsewhere',  arrow:'✈', label:'OTHER STATES / COUNTRIES',
    lat:40.800, lng:-73.905, color:'#D4537E',
    bounds:[[-60,-170],[75,170]] },
  { id:'longisland', arrow:'→', label:'LONG ISLAND',
    lat:40.736, lng:-73.870, color:'#1D9E75',
    bounds:[[40.540,-74.032],[41.100,-71.800]] },
  { id:'west',       arrow:'←', label:'WEST',
    lat:40.745, lng:-74.022, color:'#EF9F27',
    bounds:[[38.700,-76.500],[41.200,-74.032]] },
];

const HOME_BOUNDS = [[40.695,-74.032],[40.823,-73.898]];
let rZoomed = false;

function clearRegionPins() {
  pL.forEach(l => map.removeLayer(l));
  pL = [];
}

function drawRegionPins(regionId) {
  clearRegionPins();
  const rd = REGION_GALLERIES[regionId];
  if (!rd) return;
  rd.galleries.forEach(g => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:12px;height:12px;border-radius:50%;background:${rd.color};border:2.5px solid white;box-shadow:0 1px 6px rgba(0,0,0,0.25);cursor:pointer"></div>`,
      iconSize: [12,12], iconAnchor: [6,6],
    });
    const m = L.marker([g.lat, g.lng], {icon, zIndexOffset:500}).addTo(map);
    m.bindTooltip(g.name, {direction:'top', offset:[0,-8], opacity:1, className:''});
    m.on('click', () => showPop(g));
    pL.push(m);
  });
}

function flyRegion(r) {
  if (rZoomed) return;
  // 구역 보고 있으면 먼저 닫기
  if (isZ) {
    map.closePopup();
    isZ = false;
    dL.forEach(l=>map.removeLayer(l)); dL=[];
    pL.forEach(l=>map.removeLayer(l)); pL=[];
    drawDistricts();
  }
  rZoomed = true;

  // topbar 표시
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('bar-name').textContent = r.arrow + ' ' + r.label;
  document.getElementById('bar-vibe').textContent = '';
  document.getElementById('bar-count').textContent = '';
  document.getElementById('map-wrap').classList.add('detail-mode');

  // 줌 해제 후 fly
  map.scrollWheelZoom.enable();
  map.dragging.enable();
  map.touchZoom.enable();
  map.doubleClickZoom.enable();

  map.flyToBounds(r.bounds, {duration:0.8, maxZoom:7});

  // fly 완료 후 핀 그리고 다시 잠금
  map.once('moveend', function() {
    drawRegionPins(r.id);
    map.scrollWheelZoom.disable();
    map.dragging.disable();
    map.touchZoom.disable();
    map.doubleClickZoom.disable();
  });
}

function backFromRegion() {
  if (!rZoomed) return;
  rZoomed = false;
  clearRegionPins();

  document.getElementById('topbar').style.display = 'none';
  document.getElementById('map-wrap').classList.remove('detail-mode');

  map.scrollWheelZoom.enable();
  map.dragging.enable();
  map.touchZoom.enable();
  map.doubleClickZoom.enable();
  map.flyToBounds(HOME_BOUNDS, {duration:0.6});
  map.once('moveend', function() {
    map.scrollWheelZoom.disable();
    map.dragging.disable();
    map.touchZoom.disable();
    map.doubleClickZoom.disable();
    drawDistricts();
  });
}

// 화살표 마커 지도에 추가
REGIONS.forEach(r => {
  const icon = L.divIcon({
    className: '',
    html: `<div style="font-family:'DM Mono',monospace;font-size:10px;color:${r.color};letter-spacing:0.5px;white-space:nowrap;cursor:pointer;display:inline-block;background:rgba(245,243,238,0.85);padding:2px 6px;border-radius:3px;transform:${r.id==='west' ? 'translateX(-240%)' : r.id==='upstate' ? 'translateX(-90%)' : r.id==='elsewhere' ? 'translate(-20%, 6px)' : 'translateX(-65%)'}">${r.arrow} ${r.label}</div>`,
    iconSize: [0,0],
    iconAnchor: [0,9],
  });
  L.marker([r.lat, r.lng], {icon, interactive:true, zIndexOffset:100})
    .addTo(map)
    .on('click', () => flyRegion(r));
});

// 범례에 추가
const leg = document.getElementById('legend');
REGIONS.forEach(r => {
  const el = document.createElement('div');
  el.className = 'leg-item';
  el.innerHTML = `<div class="leg-dot" style="background:${r.color}"></div><span>${r.arrow} ${r.label}</span>`;
  el.onclick = () => flyRegion(r);
  leg.appendChild(el);
});
